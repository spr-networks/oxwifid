[package]
name = "barely-ap"
version = "0.1.0"
edition = "2021"
description = "A barely-an-802.11-AP with WPA2/CCMP, ported from the Python/Scapy barely-ap"
license = "MIT"

[[bin]]
name = "barely-ap"
path = "src/main.rs"

[[bin]]
name = "barely-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "barely-nan"
path = "src/bin/nan.rs"

[lib]
name = "barely_ap"
path = "src/lib.rs"

[dependencies]
aes = "0.8"
cipher = "0.4"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
getrandom = "0.2"
num-bigint = "0.4"
num-traits = "0.2"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
